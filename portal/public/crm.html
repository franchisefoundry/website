<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f4f5f0;--surface:#fff;--surface2:#fafbf7;
  --ink:#1b211a;--ink2:#59615a;--ink3:#8a918a;
  --line:#e3e6df;--line2:#eceee8;
  --green:#3a4a3a;--green-mid:#4c6350;--green-deep:#2b382b;--green-soft:#e9f0ea;
  --gold:#c8924a;--gold-ink:#a2762f;--gold-soft:#f2e9d8;
  --ok:#3f8a52;--ok-bg:#e8f3ec;--warn:#a6721a;--warn-bg:#faf0dc;
  --crit:#b64f2c;--crit-bg:#fae7df;--info:#2563eb;--info-bg:#eff6ff;
  --violet:#7c3aed;--violet-bg:#f5f3ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Sora',system-ui,sans-serif;background:var(--ground);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#d6d9d1;border-radius:99px;border:2px solid var(--surface)}
.app{display:flex;min-height:100vh}
.side{width:230px;flex-shrink:0;background:linear-gradient(168deg,#3a4a3a,#2b382b);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:16px 12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.03em;font-size:13px;padding:6px 8px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand .mk{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--gold),#e8c9a0);display:grid;place-items:center;color:#2b382b;font-weight:800;font-size:13px}
.search{display:flex;align-items:center;gap:8px;margin:12px 4px 8px;padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.55);font-size:12px;cursor:pointer}
.search kbd{margin-left:auto;font-size:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:1px 5px;font-family:inherit}
.navwrap{flex:1;overflow-y:auto;padding:4px}
.seclbl{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.28);padding:16px 10px 5px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.72);cursor:pointer;transition:.15s}
.nav:hover{background:rgba(255,255,255,.09);color:#fff}
.nav.active{background:#fff;color:var(--green);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.nav svg{width:17px;height:17px;flex-shrink:0;opacity:.85}.nav.active svg{opacity:1}
.nav .badge{margin-left:auto;font-size:10px;font-weight:700;background:var(--gold);color:#2b382b;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.userbox{border-top:1px solid rgba(255,255,255,.1);padding:12px 6px 4px;margin-top:6px}
.userrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px}
.uava{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:12px;font-weight:600}
.userrow .nm{font-size:12px;font-weight:500}.userrow .rl{font-size:10px;color:rgba(255,255,255,.4)}

.main{flex:1;min-width:0}
.content{max-width:1080px;margin:0 auto;padding:28px 32px 60px}
.content.wide{max-width:1180px}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.psub{font-size:13.5px;color:var(--ink2);margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;padding:9px 14px;border-radius:11px;border:1px solid transparent;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap}
.btn-p{background:var(--green);color:#fff;box-shadow:0 1px 2px rgba(27,33,26,.14)}.btn-p:hover{filter:brightness(1.12)}
.btn-s{background:var(--surface);color:var(--ink2);border-color:var(--line)}.btn-s:hover{background:var(--surface2)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:9px}.btn-ic{padding:8px;border-radius:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:0 1px 2px rgba(27,33,26,.04)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:600;flex-shrink:0;color:#fff}.av.sq{border-radius:10px}

/* KPI stat bar */
.kpibar{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:0 1px 2px rgba(27,33,26,.04)}
.kpi .kn{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .kl{font-size:11px;color:var(--ink3);margin-top:1px}
.kpi .kd{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;margin-top:7px;padding:2px 6px;border-radius:99px}
.kd.up{color:var(--ok);background:var(--ok-bg)}.kd.dn{color:var(--crit);background:var(--crit-bg)}.kd.fl{color:var(--ink3);background:#eef0e9}

/* HOME action center */
.home-grid{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
.grouplbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:22px 0 10px}.grouplbl:first-child{margin-top:0}
.act{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px;transition:.15s;cursor:pointer}
.act:hover{border-color:#d3d7cd;box-shadow:0 4px 14px rgba(27,33,26,.06);transform:translateY(-1px)}
.act-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.act-t{font-size:13.5px;font-weight:600}.act-s{font-size:12px;color:var(--ink2);margin-top:2px}
.act-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.feed{padding:4px 0}
.feeditem{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line2)}.feeditem:last-child{border-bottom:none}
.feed-d{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.feed-t{font-size:12.5px;line-height:1.35}.feed-time{font-size:11px;color:var(--ink3);margin-top:2px}

/* toolbar + filters */
.listbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tbsearch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:13px;color:var(--ink3);min-width:220px;flex:1;max-width:340px}
.tbsearch input{border:none;outline:none;background:none;font-family:inherit;font-size:13px;color:var(--ink);flex:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink2);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--green);color:#fff}

/* CARD GRID (network view) */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px;cursor:pointer;transition:.16s;position:relative;box-shadow:0 1px 2px rgba(27,33,26,.04)}
.ncard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(27,33,26,.08);border-color:#d6dace}
.ncard.upd{border-color:#e6cfa6}
.nb{position:absolute;top:14px;right:14px;display:inline-flex;align-items:center;gap:4px;background:var(--gold);color:#2b382b;font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 8px;box-shadow:0 1px 3px rgba(200,146,74,.4)}
.nc-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.nc-nm{font-size:15px;font-weight:600;line-height:1.2}
.nc-sub{font-size:12px;color:var(--ink3);margin-top:2px}
.nc-stats{display:flex;gap:6px;border-top:1px solid var(--line2);padding-top:12px}
.nc-stat{flex:1}
.nc-stat .sv{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.nc-stat .sl{font-size:10.5px;color:var(--ink3);margin-top:1px}
.nc-upd{margin-top:12px;background:var(--gold-soft);border-radius:10px;padding:8px 11px;font-size:11.5px;color:var(--gold-ink);font-weight:500;display:flex;align-items:center;gap:7px}
.nc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:13px}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;width:100%;margin-top:6px}
.progress i{display:block;height:100%;background:var(--green);border-radius:99px}

/* page tabs (marketplace) */
.ptabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px;width:fit-content}
.ptab{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer}
.ptab.on{background:var(--green);color:#fff}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-crit{background:var(--crit-bg);color:var(--crit)}.p-info{background:var(--info-bg);color:var(--info)}
.p-green{background:var(--green-soft);color:var(--green)}.p-violet{background:var(--violet-bg);color:var(--violet)}
.p-mute{background:#eef0e9;color:var(--ink2)}
.dotg{width:7px;height:7px;border-radius:50%;background:currentColor}
.score{font-size:12px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:8px;padding:2px 7px;font-variant-numeric:tabular-nums}
.reveal{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--violet);background:var(--violet-bg);border:1px solid #ddd6fe;border-radius:99px;padding:1px 7px;font-weight:600}
.why{display:flex;gap:6px;flex-wrap:wrap}
.why span{font-size:11px;background:var(--green-soft);color:var(--green);border-radius:99px;padding:3px 9px;font-weight:500;display:inline-flex;align-items:center;gap:4px}

/* DRAWER + record shared */
.drawer-bg{position:fixed;inset:0;background:rgba(20,25,20,.30);opacity:0;pointer-events:none;transition:.25s;z-index:55}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(500px,96vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.16);transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);z-index:60;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dw-top{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.dw-top .btn-ic{color:var(--ink3)}
.dw-crumb{font-size:12px;color:var(--ink3)}
.dw-head{padding:18px 22px 16px;border-bottom:1px solid var(--line2)}
.dw-id{display:flex;gap:14px;align-items:center}
.dw-name{font-size:18px;font-weight:700;letter-spacing:-.01em}
.dw-meta{font-size:12.5px;color:var(--ink2);margin-top:2px}
.dw-actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.dw-tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--line2);overflow-x:auto}
.dw-tab{padding:12px 4px;margin-right:18px;font-size:13px;font-weight:500;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.dw-tab.on{color:var(--ink);border-color:var(--green)}
.dw-body{flex:1;overflow-y:auto;padding:20px 22px}
.dw-sec{margin-bottom:24px}
.dw-sec-t{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:11px}
.field{display:flex;justify-content:space-between;gap:16px;padding:9px 8px;border-radius:8px;font-size:13px;transition:.12s}
.field:hover{background:var(--surface2)}
.field .k{color:var(--ink2)}.field .v{font-weight:500;text-align:right;display:flex;align-items:center;gap:7px}
.field .pen{opacity:0;transition:.12s}.field:hover .pen{opacity:.5}
.brandcard{border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px}
.bc-top{display:flex;align-items:center;gap:13px}
.mini-step{display:flex;align-items:center;gap:4px;margin-top:6px}
.ms{flex:1;height:6px;border-radius:99px;background:var(--line)}
.ms.done{background:var(--green)}.ms.now{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.mslabels{display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--ink3)}
.mslabels .now{color:var(--green);font-weight:700}
.optrow{border-radius:9px}
.optrow .whypanel{display:none;padding:0 8px 10px}
.optrow.open .whypanel{display:block}
.chev{display:inline-block;transition:transform .16s;color:var(--ink3)}
.optrow.open .chev{transform:rotate(90deg)}
.tl-i{position:relative;padding:0 0 16px 18px}
.tl-i:before{content:"";position:absolute;left:0;top:3px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.tl-i:after{content:"";position:absolute;left:4px;top:12px;bottom:-3px;width:1.5px;background:var(--line)}
.tl-i:last-child:after{display:none}
.tl-t{font-size:13px;font-weight:500}.tl-d{font-size:11.5px;color:var(--ink3);margin-top:1px}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{max-width:82%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.4}
.msg .mt{font-size:10.5px;color:var(--ink3);margin-top:4px}
.msg.them{background:var(--surface2);border:1px solid var(--line2);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--green);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.msg.me .mt{color:rgba(255,255,255,.6)}
.pushnote{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3);background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;margin-bottom:14px}
.composer{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);border-radius:13px;padding:8px;background:var(--surface)}
.composer textarea{flex:1;border:none;outline:none;resize:none;font-family:inherit;font-size:13px;color:var(--ink);max-height:80px}

/* Full page record */
.recgrid{display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start}
.rechero{display:flex;gap:16px;align-items:center}

/* Chat hub */
.chathub{display:grid;grid-template-columns:310px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(27,33,26,.04);height:calc(100vh - 180px);min-height:460px}
.convlist{border-right:1px solid var(--line2);overflow-y:auto}
.conv{display:flex;gap:11px;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line2);cursor:pointer;transition:.12s}
.conv:hover{background:var(--surface2)}.conv.on{background:var(--green-soft)}
.conv-main{min-width:0;flex:1}
.conv-nm{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.conv-last{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv-time{font-size:10.5px;color:var(--ink3)}
.unread{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0}
.convmain{display:flex;flex-direction:column;min-width:0}
.convhead{display:flex;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.convbody{flex:1;overflow-y:auto;padding:18px}
.convfoot{padding:12px 16px;border-top:1px solid var(--line2)}

.cmdk-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding-top:13vh;z-index:80}
.cmdk{width:min(560px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line2)}
.cmdk-in input{flex:1;border:none;outline:none;font-family:inherit;font-size:15px;color:var(--ink)}
.cmdk-list{max-height:340px;overflow:auto;padding:8px}
.cmdk-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500}
.cmdk-row:hover,.cmdk-row.on{background:var(--green-soft)}
.cmdk-ic{width:28px;height:28px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;color:var(--ink2)}
.cmdk-sub{font-size:11px;color:var(--ink3);margin-left:auto}

@media(max-width:1000px){.kpibar{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:.25s}.side.open{transform:none}
  .home-grid,.recgrid{grid-template-columns:1fr}.content{padding:16px 14px 50px}.mobtop{display:flex!important}
  .hide-sm{display:none!important}.chathub{grid-template-columns:1fr}.convlist{display:none}
}
.mobtop{display:none;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(168deg,#3a4a3a,#2b382b);color:#fff;position:sticky;top:0;z-index:20}
.mobtoggle{background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:18px}
.demo-tag{position:fixed;left:14px;bottom:14px;background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:6px 11px;border-radius:99px;opacity:.85;z-index:30}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:0 1px 2px rgba(27,33,26,.04);padding:30px 34px}
.doc h2{font-size:18px;font-weight:700;text-align:center}
.clause{padding:13px 0;border-top:1px solid var(--line2);position:relative}
.clause:hover .edit{opacity:.55!important}
.clause h4{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.clause p{font-size:13px;line-height:1.6;color:var(--ink2)}
.signrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line2)}
.signrow:first-child{border-top:none}
.mhero{border-radius:16px;color:#fff;padding:42px 34px;background:linear-gradient(135deg,#3a4a3a,#2b382b)}
.mhero h2{font-size:30px;font-weight:700;letter-spacing:-.02em}
@media(max-width:900px){.mhero h2{font-size:22px}.mhero p{max-width:100%!important}}
.ctxmenu{position:fixed;z-index:75;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(27,33,26,.16);padding:6px;min-width:210px;display:none}
.ctxmenu .cm-h{font-size:11px;color:var(--ink3);padding:6px 10px 5px;font-weight:600;border-bottom:1px solid var(--line2);margin-bottom:4px}
.ctxmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;font-family:inherit;font-size:13px;color:var(--ink);padding:9px 10px;border-radius:8px;cursor:pointer}
.ctxmenu button:hover{background:var(--surface2)}
.ctxmenu button.cm-danger{color:var(--crit)}.ctxmenu button.cm-danger:hover{background:var(--crit-bg)}
.modal-bg{position:fixed;inset:0;background:rgba(20,25,20,.42);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:18px;width:min(430px,100%);box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden}
.md-h{font-size:16px;font-weight:600;padding:20px 22px 0}
.md-b{padding:12px 22px 18px}.md-b p{font-size:13px;color:var(--ink2);line-height:1.55}
.md-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line2);background:var(--surface2)}
.md-lbl{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',2800);}
function resendInvite(type,i){toast(`Invite re-sent to ${recName(type,i)}`);}

function render(){const v=document.getElementById('view');v.className='content'+(current==='record'||current==='agrdoc'||current==='microsite'?' wide':'');closeMenu();const map={home:vHome,analytics:vAnalytics,finance:vFinance,franchisees:vFranchisees,brands:vBrands,agents:vAgents,territories:vTerritories,marketplace:vMarketplace,resales:vResales,messages:vMessages,agreements:vAgreements,settings:vSettings,record:vRecord,agrdoc:vAgreement,microsite:vMicrosite};v.innerHTML=(map[current]||vHome)()}

const CMDS=[['Home','home','home','view'],['Analytics','chart','analytics','view'],['Finance','wallet','finance','view'],['Territories','map','territories','view'],['Resales','tag','resales','view'],['Settings','gear','settings','view'],['Franchisees','leads','franchisees','view'],['Brands','for','brands','view'],['Agents','agent','agents','view'],['Marketplace','market','marketplace','view'],['Messages','chats','messages','view'],['Agreements','agr','agreements','view'],...CAND.map((c,i)=>[c.n,'leads','cand:'+i,'franchisee']),...BRANDS.map((b,i)=>[b.n,'for','brand:'+i,'brand'])];
let cmdkSel=0;
function openCmdk(){document.getElementById('cmdkbg').style.display='flex';document.getElementById('cmdkin').value='';cmdkSel=0;renderCmdk();setTimeout(()=>document.getElementById('cmdkin').focus(),30)}
function closeCmdk(){document.getElementById('cmdkbg').style.display='none'}
function cmdkFiltered(){const q=(document.getElementById('cmdkin').value||'').toLowerCase();return CMDS.filter(c=>c[0].toLowerCase().includes(q)).slice(0,8)}
function cmdkRun(c){closeCmdk();if(c[2].startsWith('cand:'))openRecord('cand',+c[2].split(':')[1]);else if(c[2].startsWith('brand:'))openRecord('brand',+c[2].split(':')[1]);else go(c[2])}
function renderCmdk(){const list=cmdkFiltered();document.getElementById('cmdklist').innerHTML=list.map((c,i)=>`<div class="cmdk-row ${i===cmdkSel?'on':''}" onclick="cmdkRun(cmdkFiltered()[${i}])"><span class="cmdk-ic">${ico(c[1],15)}</span>${c[0]}<span class="cmdk-sub">${c[3]}</span></div>`).join('')||'<div style="padding:20px;text-align:center;color:var(--ink3);font-size:13px">No matches</div>'}
function cmdkKey(e){const list=cmdkFiltered();if(e.key==='ArrowDown'){cmdkSel=Math.min(cmdkSel+1,list.length-1);renderCmdk()}if(e.key==='ArrowUp'){cmdkSel=Math.max(cmdkSel-1,0);renderCmdk()}if(e.key==='Enter'&&list[cmdkSel])cmdkRun(list[cmdkSel]);if(e.key==='Escape')closeCmdk()}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('cmdkbg').style.display==='flex'?closeCmdk():openCmdk()}if(e.key==='Escape')closeDrawer()});

seedMsgs();renderNav();render();
</script>
</body>
</html>
