<!DOCTYPE html>
<html lang="en-GB" data-api="https://portal.franchisefoundry.co.uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Track my intros · The Foundry</title>
<meta name="description" content="See how your Foundry intros are going.">
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/foundry/foundry.css">
</head>
<body>
<header class="f-header"><div class="in">
  <a class="f-brand" href="/foundry/"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="8" height="15" rx="1" fill="#A9C2A3"/><rect x="12.5" y="3" width="8.5" height="18" rx="1" fill="#fff"/></svg><b>The Foundry</b><span>by Franchise Foundry</span></a>
  <nav class="f-nav" aria-label="The Foundry">
    <a href="/">Find a franchise</a>
    <a href="/foundry/">Foundry Search</a>
    <a href="/foundry/track.html" aria-current="page">Track my intros</a>
    <a href="https://portal.franchisefoundry.co.uk/login">Members</a>
  </nav>
</div></header>
<div class="preview-strip" hidden><b class="mono">PREVIEW</b> · Only people with the preview link can see this. Partners shown are demo data.</div>

<main class="wrap" style="max-width:860px;padding-top:28px;padding-bottom:48px"><div id="track"></div></main>
<footer class="footer">Free for franchisees. Partners are vetted by Franchise Foundry. <a href="/terms.html">Terms</a> · <a href="https://portal.franchisefoundry.co.uk/privacy">Privacy</a></footer>
<script src="/foundry/foundry.js"></script>
<script>
(function () {
  var F = Foundry, esc = F.esc, b = F.qs('b'), t = F.qs('t'), box = document.getElementById('track')
  var STEPS = ['Requested', 'Briefed', 'Contacted you', 'How did it go?']
  var RATINGS = [['going_well', 'Going well'], ['slow', 'Slow to reply'], ['not_fit', 'Not a fit']]
  function when(iso) { return new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) }

  function askForLink(msg) {
    box.innerHTML = '<h1 class="h-big">Track my intros<span class="accent">.</span></h1>' +
      '<p style="color:var(--ink-2);margin-top:6px">' + esc(msg || 'Your tracker link is in the emails we sent you. Lost it? We’ll send it again.') + '</p>' +
      '<form id="resend" class="panel" style="margin-top:18px;display:grid;gap:12px;max-width:480px"><label class="field">Email you used<input type="email" name="email" required autocomplete="email"></label>' +
      '<button class="btn btn-green" type="submit">Email me my link</button><p id="done" style="font-size:14px" hidden></p></form>'
    document.getElementById('resend').addEventListener('submit', function (e) {
      e.preventDefault()
      var email = new FormData(this).get('email'), btn = this.querySelector('button'), done = document.getElementById('done')
      btn.disabled = true
      F.api('/api/foundry/track/resend', { method: 'POST', body: { email: email } }).then(function (r) {
        done.textContent = (r.data && (r.data.message || r.data.error)) || 'Done.'; done.hidden = false; btn.disabled = false
      })
    })
  }

  function render(d) {
    var fresh = F.qs('new') === '1'
    box.innerHTML = (fresh ? '<div class="panel" style="display:flex;gap:14px;align-items:center;margin-bottom:18px;border-color:#bfe0cb;background:var(--ok-bg)"><span class="ok-ico" aria-hidden="true" style="background:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f7a4a" stroke-width="2.5" stroke-linecap="round"><path d="M5 12l5 5L19 8"/></svg></span><div><b>Confirmed. We’re briefing them now.</b><br><span style="font-size:14px;color:var(--ink-2)">Bookmark this page. It’s your tracker, no login needed. We’ll email you at every step.</span></div></div>' : '') +
      '<h1 class="h-big">' + (d.name ? esc(d.name.split(' ')[0]) + '’s intros' : 'Your intros') + '<span class="accent">.</span></h1>' +
      '<p style="color:var(--ink-2);margin:6px 0 18px">Every partner you asked us to introduce, and where it’s up to.</p>' +
      d.intros.map(function (i) {
        var st = i.status
        return '<article class="track-item" data-id="' + esc(i.id) + '">' +
          '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><div style="display:flex;gap:10px;align-items:center">' + F.monogram(i.partner.name) +
          '<div><a href="/foundry/partner.html?s=' + encodeURIComponent(i.partner.slug) + '" style="font-weight:700;color:var(--ink);text-decoration:none">' + esc(i.partner.name) + '</a><div class="cat">' + esc(i.partner.categoryLabel) + '</div></div></div>' +
          '<span style="font-size:13px;font-weight:600;color:' + (st.tone === 'good' ? 'var(--ok)' : st.tone === 'progress' ? 'var(--gold-ink)' : 'var(--ink-3)') + '">' + esc(st.status) + '</span></div>' +
          '<div class="bars" aria-hidden="true">' + STEPS.map(function (s, n) { return '<div class="' + (n < st.step ? 'on' : '') + '"><i></i><small>' + s + '</small></div>' }).join('') + '</div>' +
          (st.next ? '<p style="margin-top:10px;font-size:14px;color:var(--ink-2)">' + esc(st.next) + '</p>' : '') +
          (i.contact ? '<div class="contact-box"><b>Your contact: ' + esc(i.contact.name) + (i.contact.role ? ', ' + esc(i.contact.role) : '') + '</b><br>' +
            [i.contact.email ? '<a href="mailto:' + esc(i.contact.email) + '">' + esc(i.contact.email) + '</a>' : '', i.contact.phone ? '<a href="tel:' + esc(i.contact.phone.replace(/\s/g, '')) + '">' + esc(i.contact.phone) + '</a>' : ''].filter(Boolean).join(' · ') + '</div>' : '') +
          '<ol class="timeline">' + i.events.map(function (e) { return '<li><div>' + esc(e.body) + '<small>' + esc(when(e.at)) + '</small></div></li>' }).join('') + '</ol>' +
          (st.step >= 3 || i.stage === 'closed' ? '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><b style="font-size:14px">How’s it going?</b><div class="seg" style="margin-top:8px">' +
            RATINGS.map(function (r) { return '<button type="button" data-rate="' + r[0] + '" aria-pressed="' + (i.rating === r[0]) + '">' + r[1] + '</button>' }).join('') +
            '</div><p style="font-size:12px;color:var(--ink-3);margin-top:6px">Only we see this.</p></div>' : '') +
          (st.open && i.stage !== 'outcome' ? '<p style="margin-top:12px;font-size:12px"><button type="button" data-withdraw style="border:0;background:none;color:var(--ink-3);text-decoration:underline;min-height:36px">Withdraw this intro</button></p>' : '') +
        '</article>'
      }).join('') +
      '<p style="margin-top:20px;font-size:14px;color:var(--ink-2)">Need something else? <a href="/foundry/">Search The Foundry</a>. Looking for the right franchise too? <a href="https://portal.franchisefoundry.co.uk/get-matched">Get matched for free</a>.</p>'
  }

  function load() {
    F.api('/api/foundry/track?b=' + encodeURIComponent(b) + '&t=' + encodeURIComponent(t)).then(function (r) {
      if (!r.ok) return askForLink('That tracker link isn’t valid. Enter your email and we’ll send a fresh one.')
      render(r.data)
    })
  }

  box.addEventListener('click', function (e) {
    var el = e.target.closest('button'); if (!el) return
    var id = el.closest('[data-id]') && el.closest('[data-id]').getAttribute('data-id'); if (!id) return
    if (el.dataset.rate) {
      F.api('/api/foundry/track', { method: 'POST', body: { b: b, t: t, action: 'rate', requestId: id, rating: el.dataset.rate } }).then(load)
    } else if (el.hasAttribute('data-withdraw')) {
      if (!confirm('Withdraw this intro and stop sharing your details with this partner?')) return
      F.api('/api/foundry/track', { method: 'POST', body: { b: b, t: t, action: 'withdraw', requestId: id } }).then(load)
    }
  })

  F.gate().then(function (ok) { if (ok) { if (b && t) load(); else askForLink() } })
})()
</script>
</body>
</html>
