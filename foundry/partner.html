<!DOCTYPE html>
<html lang="en-GB" data-api="https://portal.franchisefoundry.co.uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Partner · The Foundry</title>
<meta name="description" content="A vetted Franchise Foundry partner.">
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/foundry/foundry.css">
</head>
<body>
<header class="f-header"><div class="in">
  <a class="f-brand" href="/foundry/"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="8" height="15" rx="1" fill="#A9C2A3"/><rect x="12.5" y="3" width="8.5" height="18" rx="1" fill="#fff"/></svg><b>The Foundry</b><span>by Franchise Foundry</span></a>
  <nav class="f-nav" aria-label="The Foundry">
    <a href="/">Find a franchise</a>
    <a href="/foundry/">Foundry Search</a>
    <a href="/foundry/partners/">Partners</a>
    <a href="/foundry/track.html">Track my intros</a>
    <a href="https://portal.franchisefoundry.co.uk/login">Members</a>
  </nav>
</div></header>
<div class="preview-strip" hidden><b class="mono">PREVIEW</b> · Only people with the preview link can see this. Partners shown are demo data.</div>

<main class="wrap"><div id="profile"><div class="skeleton" style="margin-top:24px"></div></div></main>
<footer class="footer">Free for franchisees. Partners are vetted by Franchise Foundry. <a href="/foundry/apply.html">Become a partner</a> · <a href="/terms.html">Terms</a> · <a href="https://portal.franchisefoundry.co.uk/privacy">Privacy</a></footer>
<script src="/foundry/foundry.js"></script>
<script src="/foundry/render.js"></script>
<script>
(function () {
  var F = Foundry, R = FoundryRender
  // /foundry/partners/<slug>/ (falls back here until the page is built) or the old ?s=<slug>
  var m = location.pathname.match(/^\/foundry\/partners\/([a-z0-9-]{1,80})\/?$/)
  var slug = m ? m[1] : F.qs('s')
  if (!/^[a-z0-9-]{1,80}$/.test(slug)) { location.href = '/foundry/'; return }
  F.gate().then(function (ok) { if (ok) return F.api('/api/foundry/partners/' + slug).then(show) })
  function show(r) {
    if (!r.ok) { document.getElementById('profile').innerHTML = '<div class="soon"><h1>Partner not found<span class="accent">.</span></h1><p><a href="/foundry/">Back to Foundry Search</a></p></div>'; return }
    var p = r.data
    document.title = p.name + ' · The Foundry'
    document.getElementById('profile').innerHTML = R.profile(p, { inList: F.inList(p.id) })
    F.bindProfile(p)
  }
})()
</script>
</body>
</html>
