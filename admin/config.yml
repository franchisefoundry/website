backend:
  name: github
  repo: franchisefoundry/website
  branch: main

media_folder: "images"
public_folder: "/images"

collections:

  # ── Articles / Blog ───────────────────────────────────────────────────────
  # Each article is a markdown file in content/articles/. The build step
  # (build-articles.mjs) turns these into real /articles/<slug>.html pages and
  # adds them to the blog listing on deploy.
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    # Each row shows its status + date so live and draft articles are easy to tell apart.
    summary: "{{status}}  ·  {{title}}  ·  {{date}}"
    sortable_fields: ["date", "title", "status"]
    # Quick views: see everything, only what's live, or only drafts.
    view_filters:
      - label: "🟢 Live on the website"
        field: status
        pattern: "Published"
      - label: "✏️ Drafts (not yet live)"
        field: status
        pattern: "Draft"
    fields:
      - { label: "Title", name: "title", widget: "string" }

      # ── Publishing ──────────────────────────────────────────────────────────
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Draft", "Published"]
        default: "Draft"
        hint: "Draft = only you can see it here. Set to Published and press Save to put it live on the website."

      - label: "Feature as the blog headline"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
        hint: "Shows this article large at the top of the blog. If more than one is featured, the newest wins."

      # ── Ordering ────────────────────────────────────────────────────────────
      - label: "Publish date  —  controls the order on the site"
        name: "date"
        widget: "datetime"
        hint: "Articles are shown newest-first on the blog. To move one higher or lower, change this date."

      # ── Content ─────────────────────────────────────────────────────────────
      - { label: "Category", name: "category", widget: "select", default: "Industry Insight",
          options: ["Industry Insight", "Franchise Advice", "Market Analysis", "Guides"] }
      - { label: "Author", name: "author", widget: "string", default: "Franchise Foundry" }
      - { label: "Short excerpt (shown on the blog card + as the SEO description)", name: "excerpt", widget: "text" }
      - { label: "Cover image (optional)", name: "coverImage", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # ── Pages ─────────────────────────────────────────────────────────────────
  - name: "pages"
    label: "Pages"
    files:

      # Homepage
      - label: "Homepage"
        name: "homepage"
        file: "content/homepage.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Main Headline", name: "title", widget: "string", hint: "e.g. Your perfect franchise. Found for free." }
              - { label: "Sub-headline", name: "subtitle", widget: "text", hint: "One sentence below the headline" }

          - label: "Stats Bar"
            name: "stats"
            widget: "object"
            fields:
              - { label: "Stat 1 — Number", name: "years", widget: "string", hint: "e.g. 15+" }
              - { label: "Stat 1 — Label", name: "yearsDesc", widget: "string" }
              - { label: "Stat 2 — Number", name: "freeLabel", widget: "string", hint: "e.g. 100%" }
              - { label: "Stat 2 — Label", name: "freeDesc", widget: "string" }
              - { label: "Stat 3 — Number", name: "worth", widget: "string" }
              - { label: "Stat 3 — Label", name: "worthDesc", widget: "string" }

          - label: "Why Choose Us — Benefit Cards"
            name: "benefits"
            widget: "list"
            hint: "The four cards in the 'Why Franchise Foundry?' section"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Match Preview Section"
            name: "matchPreview"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Section Description", name: "description", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string" }

          - label: "How It Works"
            name: "howItWorks"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Section Subtitle", name: "subtitle", widget: "text" }

          - label: "How It Works — Steps"
            name: "steps"
            widget: "list"
            hint: "The four numbered steps"
            fields:
              - { label: "Step Title", name: "title", widget: "string" }
              - { label: "Step Description", name: "description", widget: "text" }

          - label: "Final Call to Action"
            name: "finalCTA"
            widget: "object"
            fields:
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string" }

      # About Us
      - label: "About Us"
        name: "about"
        file: "content/about.json"
        fields:
          - label: "Page Header"
            name: "header"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }

          - label: "Our Story"
            name: "story"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Paragraph 1", name: "text1", widget: "text" }
              - { label: "Paragraph 2", name: "text2", widget: "text" }
              - { label: "Paragraph 3", name: "text3", widget: "text" }

          - label: "Experience Cards"
            name: "experience"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Why We Do This"
            name: "why"
            widget: "object"
            fields:
              - { label: "Pull Quote", name: "quote", widget: "text" }
              - { label: "Paragraph 1", name: "text1", widget: "text" }
              - { label: "Paragraph 2", name: "text2", widget: "text" }
              - { label: "Paragraph 3", name: "text3", widget: "text" }

          - label: "Values"
            name: "values"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

      # Contact Page
      - label: "Contact Page"
        name: "contact"
        file: "content/contact.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "text" }
          - label: "Contact Methods"
            name: "methods"
            widget: "object"
            fields:
              - { label: "Email Label", name: "emailLabel", widget: "string" }
              - { label: "Availability Label", name: "availLabel", widget: "string" }
              - { label: "Availability Text", name: "availText", widget: "string" }
          - label: "Contact Form"
            name: "form"
            widget: "object"
            fields:
              - { label: "Form Title", name: "title", widget: "string" }
              - { label: "Submit Button Text", name: "submitButton", widget: "string" }

      # Get Your Match Page
      - label: "Get Your Match Page"
        name: "findmatch"
        file: "content/findmatch.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string", hint: "Shown in the hero banner" }
          - { label: "Page Introduction", name: "intro", widget: "text", hint: "Subtitle text in the hero banner" }
          - label: "What Happens Next — Section"
            name: "nextSteps"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - label: "Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Step Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }

      # For Franchise Brands
      - label: "For Franchise Brands"
        name: "forbrands"
        file: "content/forbrands.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "text" }
          - label: "Partnership Benefits"
            name: "benefits"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "How Partnership Works"
            name: "howItWorks"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - label: "Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Step Number", name: "number", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Ideal Partner Profile"
            name: "idealPartner"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Criteria"
                name: "criteria"
                widget: "list"
                fields:
                  - { label: "Criterion", name: "text", widget: "string" }
          - label: "CTA Section"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string" }

      # Footer
      - label: "Footer"
        name: "footer"
        file: "content/footer.json"
        fields:
          - { label: "Brand Description", name: "brandDescription", widget: "text" }
          - { label: "Brand Tagline", name: "brandTagline", widget: "string" }
          - { label: "Quick Links Title", name: "quickLinksTitle", widget: "string" }
          - label: "Quick Links"
            name: "links"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - { label: "Contact Section Title", name: "contactTitle", widget: "string" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "Phone Number", name: "phone", widget: "string", required: false, hint: "Leave blank to hide" }
          - { label: "Address", name: "address", widget: "string", required: false, hint: "Leave blank to hide" }
          - { label: "Copyright Text", name: "copyrightText", widget: "string" }

      # Site Settings
      - label: "Site Settings"
        name: "settings"
        file: "content/settings.json"
        fields:
          - { label: "Company Name", name: "companyName", widget: "string" }
          - { label: "Contact Email", name: "email", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image" }
          - { label: "Favicon", name: "favicon", widget: "image" }
          - { label: "Loading Animation Logo", name: "loadingLogo", widget: "image", hint: "Icon shown spinning on the 'Getting your matches' loading screen. Use the icon-only version — no text." }
          - label: "Partner Logos (scrolling banner)"
            name: "partners"
            widget: "list"
            fields:
              - { label: "Partner Logo", name: "logo", widget: "image" }
              - { label: "Partner Name", name: "name", widget: "string" }
